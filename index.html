
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colour Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎨 Colour Game</h1>
  <div class="balance">💰 Balance: ₹<span id="balance">500</span></div>

  <div class="bet-buttons">
    <button class="bet-btn" data-bet="1">₹1</button>
    <button class="bet-btn" data-bet="2">₹2</button>
    <button class="bet-btn" data-bet="5">₹5</button>
    <button class="bet-btn" data-bet="10">₹10</button>
    <button class="bet-btn" data-bet="20">₹20</button>
    <button class="bet-btn" data-bet="50">₹50</button>
    <button class="bet-btn" data-bet="100">₹100</button>
    <button class="bet-btn" data-bet="500">₹500</button>
  </div>

  <h3>Choose Colour:</h3>
  <div class="colour-buttons">
    <button class="colour-btn" data-colour="Red" style="background:red;">Red</button>
    <button class="colour-btn" data-colour="Green" style="background:green;">Green</button>
    <button class="colour-btn" data-colour="Blue" style="background:blue;">Blue</button>
    <button class="colour-btn" data-colour="Yellow" style="background:gold;">Yellow</button>
  </div>

  <div class="result">
    <p id="resultText">🎲 Play to see result!</p>
  </div>

  <h3>📜 History</h3>
  <ul id="history"></ul>

  <script src="script.js"></script>
</body>
</html>
